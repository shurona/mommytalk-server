spring:
  profiles:
    active: ${ACTIVE}
  config:
    import: optional:file:.env.local[.properties]
  application:
    name: mommytalk-server
  datasource:
    url: ${DB_URL}
    username: ${DB_USER_NAME}
    password: ${DB_PASSWORD}
    #    driver-class-name: com.mysql.cj.jdbc.Driver
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      default_batch_fetch_size: 100
#    properties:
#      hibernate:
#        show_sql: true # sql
#        format_sql: true # SQL
#        highlight_sql: true # SQL

line:
  auth:
    channel-id: ${LINE_AUTH_CHANNEL_ID}
    secret-key: ${LINE_AUTH_SECRET_KEY}
  secret-key: ${LINE_CHANNEL_SECRET}
  base-url: ${LINE_BASE_URL}
  api:
    token-url: https://api.line.me/oauth2/v2.1/token
    profile-url: https://api.line.me/v2/profile

admin:
  header-key: ${ADMIN_HEADER_KEY}
  header-value: ${ADMIN_HEADER_VALUE}


jwt:
  secret:
    key: ${JWT_SECRET_KEY}

openai:
  base-url: https://api.openai.com/v1
  openApiKey: ${OPEN_AI_KEY}

kakao:
  base-url: https://api-alimtalk.cloud.toast.com
  app-key: ${KAKAO_APP_KEY}
  secret-key: ${KAKAO_SECRET_KEY}
  oauth:
    client-id: ${KAKAO_OAUTH_CLIENT_ID}
    client-secret: ${KAKAO_OAUTH_CLIENT_SECRET}

elevenlabs:
  base-url: https://api.elevenlabs.io
  api-key: ${ELEVENLABS_API_KEY}  # 환경 변수로 관리
  voice-id: Xb7hH8MSUJpSbSDYk0k2
  output-dir: elevenlabs           # 프로젝트 루트/elevenlabs/에 저장

cloudflare:
  r2:
    account-id: ${CLOUDFLARE_ACCOUNT_ID}
    access-key-id: ${CLOUDFLARE_ACCESS_KEY_ID}
    secret-access-key: ${CLOUDFLARE_SECRET_ACCESS_KEY}
    bucket-name: ${CLOUDFLARE_BUCKET_NAME}
    endpoint: ${CLOUDFLARE_ENDPOINT}  # https://<account-id>.r2.cloudflarestorage.com
    public-url: ${CLOUDFLARE_PUBLIC_URL}  # 공개 URL (optional)

front:
  base-url: ${FRONT_CLIENT_BASE_URL}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
